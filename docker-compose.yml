services:
  graphdb:
    image: ontotext/graphdb:${GRAPHDB_TAG:-10.7.4}
    container_name: graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      # Persistenza dei dati e delle configurazioni
      - ${GRAPHDB_HOME:-./docker-data/graphdb-home}:/opt/graphdb/home
      # Cartella host dove inserire i file RDF da importare
      - ${GRAPHDB_IMPORT:-./data/films/}:/root/graphdb-import:ro

      # - ./graphdb-extension/target/graphdb-extension-0.1.0.jar:/opt/graphdb/dist/lib/graphdb-extension-0.1.0.jar:ro
# extra_hosts:
#   - "host.docker.internal:host-gateway"
