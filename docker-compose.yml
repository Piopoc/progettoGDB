services:
  graphdb:
    image: ontotext/graphdb:10.7.4
    container_name: graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      # Persistenza dei dati e delle configurazioni
      - ./graphdb-data:/opt/graphdb/home
      # Cartella host dove inserire i file RDF da importare
      - ./import:/root/graphdb-import
